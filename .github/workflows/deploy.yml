name: Deploy to Production

on:
  push:
    branches: [master]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

# ─────────────────────────────────────────────────────────────────────────────
# Secrets à configurer dans le repo BACKEND (Settings > Secrets > Actions) :
#
#   SERVER_HOST            = 51.178.27.251
#   SERVER_USER            = debian
#   SERVER_SSH_KEY         = contenu de ~/.ssh/id_rsa
#   SERVER_SSH_KNOWN_HOST  = sortie de : ssh-keyscan 51.178.27.251
#
#   DB_PASSWORD            openssl rand -base64 32
#   REDIS_PASSWORD         openssl rand -base64 32
#   RABBITMQ_PASSWORD      openssl rand -base64 32
#   MINIO_SECRET_KEY       openssl rand -base64 32
#   JWT_SECRET             openssl rand -base64 48
#   JWT_REFRESH_SECRET     openssl rand -base64 48
#   INTERNAL_SERVICE_TOKEN openssl rand -hex 32
#
#   STRIPE_PUBLISHABLE_KEY  pk_test_...
#   GOOGLE_CLIENT_ID        ...apps.googleusercontent.com
#   GOOGLE_CLIENT_SECRET    GOCSPX-...
#   RESEND_API_KEY          re_...
#   EMAIL_FROM              noreply@craftea.fr
#   ADMIN_EMAIL             admin@craftea.fr
#   UMAMI_APP_SECRET        openssl rand -base64 32
#   UMAMI_DATABASE_URL      postgresql://craftea:<DB_PASSWORD_URL_ENCODED>@db:5432/craftea_umami
#                           (encoder le mot de passe : python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=''))" "MOT_DE_PASSE")
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # UNIT TESTS — Jest + ts-jest, matrix par service
  # Non-bloquant : le deploy se lance même en cas d'échec (if: always())
  # ─────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit · ${{ matrix.service }} (≥${{ matrix.threshold }}%)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: payment-service
            threshold: 85
          - service: order-service
            threshold: 85
          - service: user-service
            threshold: 80
          - service: artist-service
            threshold: 70
          - service: catalog-service
            threshold: 70
          - service: cart-service
            threshold: 70
          - service: interaction-service
            threshold: 70

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Tests + coverage (seuil ${{ matrix.threshold }}%)
        run: |
          npx jest \
            --coverage \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageThreshold='{"global":{"lines":${{ matrix.threshold }}}}' \
            --passWithNoTests \
            --forceExit
        working-directory: ${{ matrix.service }}
        continue-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────
  # INTEGRATION TESTS — Supertest, HTTP → base de données
  # Endpoints critiques : auth (register/login), profil, permissions
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration · Supertest (endpoints critiques)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: unit-tests

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: craftea
          POSTGRES_PASSWORD: craftea
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: craftea
          RABBITMQ_DEFAULT_PASS: craftea
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Initialiser les bases de données
        run: PGPASSWORD=craftea psql -h localhost -U craftea -d postgres -f docker/init.sql

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── user-service ──────────────────────────────────────────────────────
      - name: Install · user-service
        run: npm ci
        working-directory: user-service

      - name: Integration tests · user-service
        run: npm run test:e2e -- --forceExit
        working-directory: user-service
        continue-on-error: true
        env:
          NODE_ENV: test
          PORT: 3010
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: craftea
          DB_PASS: craftea
          DB_NAME: craftea_users
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://craftea:craftea@localhost:5672
          JWT_SECRET: ci-test-jwt-secret-32chars-min!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars!
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: craftea-uploads
          RESEND_API_KEY: re_test_dummy
          EMAIL_FROM: test@craftea.local
          INTERNAL_SERVICE_TOKEN: ci-internal-token

      # ── artist-service ────────────────────────────────────────────────────
      - name: Install · artist-service
        run: npm ci
        working-directory: artist-service

      - name: Integration tests · artist-service
        run: npm run test:e2e -- --forceExit
        working-directory: artist-service
        continue-on-error: true
        env:
          NODE_ENV: test
          PORT: 3002
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: craftea
          DB_PASS: craftea
          DB_NAME: craftea_artists
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://craftea:craftea@localhost:5672
          JWT_SECRET: ci-test-jwt-secret-32chars-min!!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          STRIPE_SECRET_KEY: sk_test_dummy

      # ── catalog-service ───────────────────────────────────────────────────
      - name: Install · catalog-service
        run: npm ci
        working-directory: catalog-service

      - name: Integration tests · catalog-service
        run: npm run test:e2e -- --forceExit
        working-directory: catalog-service
        continue-on-error: true
        env:
          NODE_ENV: test
          PORT: 3003
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: craftea
          DB_PASS: craftea
          DB_NAME: craftea_catalog
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://craftea:craftea@localhost:5672
          JWT_SECRET: ci-test-jwt-secret-32chars-min!!
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin

  # ─────────────────────────────────────────────────────────────────────────
  # E2E TESTS — Cypress headless, 5 scénarios, navigateur complet
  # Démarre l'infrastructure de test + les services NestJS critiques
  # ─────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E · Cypress (5 scénarios)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Démarrer l'infrastructure de test (postgres, redis, rabbitmq, minio)
        run: |
          docker compose -f docker-compose.test.yml up -d
          until docker exec craftea-postgres-test pg_isready -U craftea; do sleep 2; done
          PGPASSWORD=craftea docker exec craftea-postgres-test psql -U craftea -d postgres \
            -c "CREATE DATABASE craftea_artists;" \
            -c "CREATE DATABASE craftea_catalog;" \
            -c "CREATE DATABASE craftea_interactions;" \
            -c "CREATE DATABASE craftea_orders;" \
            -c "CREATE DATABASE craftea_carts;" \
            -c "CREATE DATABASE craftea_payments;" 2>/dev/null || true

      - name: Build et démarrer user-service
        run: |
          npm ci --prefer-offline && npm run build
          PORT=3010 DB_HOST=localhost DB_PORT=5433 DB_USER=craftea DB_PASS=craftea \
          DB_NAME=craftea_users REDIS_HOST=localhost REDIS_PORT=6380 \
          RABBITMQ_URL=amqp://craftea:craftea@localhost:5673 \
          JWT_SECRET=e2e-jwt-secret-min32chars-padded!! \
          JWT_REFRESH_SECRET=e2e-refresh-secret-min32ch!! \
          MINIO_ENDPOINT=localhost MINIO_PORT=9001 MINIO_ACCESS_KEY=minioadmin \
          MINIO_SECRET_KEY=minioadmin MINIO_BUCKET=craftea \
          INTERNAL_SERVICE_TOKEN=e2e-token RESEND_API_KEY=re_dummy \
          EMAIL_FROM=test@local NODE_ENV=test \
          node dist/main.js &
        working-directory: user-service

      - name: Build et démarrer catalog-service
        run: |
          npm ci --prefer-offline && npm run build
          PORT=3003 DB_HOST=localhost DB_PORT=5433 DB_USER=craftea DB_PASS=craftea \
          DB_NAME=craftea_catalog REDIS_HOST=localhost REDIS_PORT=6380 \
          RABBITMQ_URL=amqp://craftea:craftea@localhost:5673 \
          JWT_SECRET=e2e-jwt-secret-min32chars-padded!! \
          INTERNAL_SERVICE_TOKEN=e2e-token \
          MINIO_ENDPOINT=localhost MINIO_PORT=9001 MINIO_ACCESS_KEY=minioadmin \
          MINIO_SECRET_KEY=minioadmin NODE_ENV=test \
          node dist/main.js &
        working-directory: catalog-service

      - name: Démarrer l'api-gateway
        run: |
          npm ci --prefer-offline && npm run build
          PORT=3001 CORS_ORIGIN=http://localhost:3000 \
          USER_SERVICE_URL=http://localhost:3010 \
          CATALOG_SERVICE_URL=http://localhost:3003 \
          node dist/index.js &
        working-directory: api-gateway

      - name: Attendre que les services soient prêts
        run: |
          npx wait-on \
            http://localhost:3010/api/health \
            http://localhost:3003/api/health \
            http://localhost:3001/health \
            --timeout 120000

      - name: Installer Cypress
        run: npm ci
        working-directory: e2e

      - name: Exécuter Cypress (5 scénarios headless)
        uses: cypress-io/github-action@v6
        with:
          working-directory: e2e
          browser: chrome
          headed: false
          wait-on: 'http://localhost:3001/health'
          wait-on-timeout: 60
        env:
          CYPRESS_BASE_URL: http://localhost:3001
          CYPRESS_API_URL: http://localhost:3001
        continue-on-error: true

      - name: Upload screenshots (échecs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-screenshots
          path: e2e/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload vidéos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos
          path: e2e/cypress/videos
          retention-days: 7
          if-no-files-found: ignore

      - name: Arrêter l'infrastructure
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # ─────────────────────────────────────────────────────────────────────────
  # BUILD — Images Docker, push GHCR, parallèle via matrix
  # Se lance même si les tests échouent (if: always())
  # ─────────────────────────────────────────────────────────────────────────
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: api-gateway
            dockerfile: Dockerfile.gateway
          - service: user-service
            dockerfile: Dockerfile
          - service: artist-service
            dockerfile: Dockerfile
          - service: catalog-service
            dockerfile: Dockerfile
          - service: interaction-service
            dockerfile: Dockerfile
          - service: order-service
            dockerfile: Dockerfile
          - service: cart-service
            dockerfile: Dockerfile
          - service: payment-service
            dockerfile: Dockerfile
          - service: notification-service
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: SERVICE_DIR=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/craftea-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/craftea-${{ matrix.service }}:latest

  # ── Build image PostgreSQL (init.sql inclus) ───────────────────────────────
  build-postgres:
    name: Build postgres
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push postgres
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.postgres
          push: true
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,mode=max,scope=postgres
          tags: |
            ${{ env.REGISTRY }}/craftea-postgres:${{ github.sha }}
            ${{ env.REGISTRY }}/craftea-postgres:latest

  # ─────────────────────────────────────────────────────────────────────────
  # DEPLOY — Docker Swarm via SSH context
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    needs: [build-backend, build-postgres]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SERVER_SSH_KNOWN_HOST }}" > ~/.ssh/known_hosts

      - name: Create Docker context (remote swarm via SSH)
        run: |
          docker context create prod \
            --docker "host=ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          docker context use prod

      - name: Login GHCR (pour --with-registry-auth)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy stack
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          # Le frontend est géré par son propre repo — on utilise :latest
          FRONTEND_IMAGE_TAG: latest
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
          UMAMI_DATABASE_URL: ${{ secrets.UMAMI_DATABASE_URL }}
        run: |
          docker stack deploy \
            -c docker-stack.yml \
            craftea \
            --with-registry-auth \
            --prune
