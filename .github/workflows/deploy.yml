name: CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Secrets requis (Settings > Secrets > Actions) :
#
#   Serveur       SERVER_HOST · SERVER_USER · SERVER_SSH_KEY · SERVER_SSH_KNOWN_HOST
#   DB/infra      DB_PASSWORD · REDIS_PASSWORD · RABBITMQ_PASSWORD · MINIO_SECRET_KEY
#   Auth          JWT_SECRET · JWT_REFRESH_SECRET · INTERNAL_SERVICE_TOKEN
#   Stripe        STRIPE_PUBLISHABLE_KEY
#   OAuth         GOOGLE_CLIENT_ID · GOOGLE_CLIENT_SECRET
#   Mail          RESEND_API_KEY · EMAIL_FROM · ADMIN_EMAIL
#   Umami         UMAMI_APP_SECRET · UMAMI_DATABASE_URL
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  NODE_VERSION: '20'

jobs:

  # ══════════════════════════════════════════════════════════════════════════════
  # 1. LINT — ESLint + Prettier (matrice parallèle, bloquant)
  # ══════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - order-service
          - user-service
          - artist-service
          - catalog-service
          - cart-service
          - interaction-service
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: ESLint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --max-warnings 0
        working-directory: ${{ matrix.service }}

      - name: Prettier
        run: npx prettier --check "src/**/*.ts"
        working-directory: ${{ matrix.service }}

  # ══════════════════════════════════════════════════════════════════════════════
  # 2. TESTS — Jest --coverage + Supertest (conteneur PostgreSQL)
  # ══════════════════════════════════════════════════════════════════════════════
  tests:
    name: Tests · ${{ matrix.service }} (≥${{ matrix.threshold }}%)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: craftea
          POSTGRES_PASSWORD: craftea
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: craftea
          RABBITMQ_DEFAULT_PASS: craftea
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: payment-service
            threshold: 85
            db_name: craftea_payments
          - service: order-service
            threshold: 85
            db_name: craftea_orders
          - service: user-service
            threshold: 80
            db_name: craftea_users
          - service: artist-service
            threshold: 70
            db_name: craftea_artists
          - service: catalog-service
            threshold: 70
            db_name: craftea_catalog
          - service: cart-service
            threshold: 70
            db_name: craftea_carts
          - service: interaction-service
            threshold: 70
            db_name: craftea_interactions

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Init DB
        run: PGPASSWORD=craftea psql -h localhost -U craftea -d postgres -f docker/init.sql

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Unit tests + coverage (seuil ${{ matrix.threshold }}%)
        run: |
          npx jest \
            --coverage \
            --coverageReporters=text \
            --coverageReporters=lcov \
            --coverageThreshold='{"global":{"lines":${{ matrix.threshold }}}}' \
            --passWithNoTests \
            --forceExit
        working-directory: ${{ matrix.service }}

      # Supertest : uniquement si des fichiers *.e2e-spec.ts existent
      - name: Integration tests (Supertest)
        if: hashFiles(format('{0}/test/**/*.e2e-spec.ts', matrix.service)) != ''
        run: npm run test:e2e -- --forceExit
        working-directory: ${{ matrix.service }}
        continue-on-error: true
        env:
          NODE_ENV: test
          PORT: 3099
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: craftea
          DB_PASS: craftea
          DB_NAME: ${{ matrix.db_name }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          RABBITMQ_URL: amqp://craftea:craftea@localhost:5672
          JWT_SECRET: ci-test-jwt-secret-32chars-min!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32chars!
          MINIO_ENDPOINT: localhost
          MINIO_PORT: 9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET: craftea-uploads
          RESEND_API_KEY: re_test_dummy
          EMAIL_FROM: test@craftea.local
          INTERNAL_SERVICE_TOKEN: ci-internal-token
          STRIPE_SECRET_KEY: sk_test_dummy

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/lcov.info
          retention-days: 7
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════════════════
  # 3. BUILD — tsc --noEmit (vérification TypeScript sans émettre de fichiers)
  #            + next build pour le frontend si présent dans le repo
  # ══════════════════════════════════════════════════════════════════════════════
  build:
    name: Build · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - order-service
          - user-service
          - artist-service
          - catalog-service
          - cart-service
          - interaction-service
          - api-gateway
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  # ══════════════════════════════════════════════════════════════════════════════
  # 4. SECURITY — npm audit (bloquant sur high+, informationnel)
  # ══════════════════════════════════════════════════════════════════════════════
  security:
    name: Security · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true   # informatif : n'empêche pas le déploiement
    strategy:
      fail-fast: false
      matrix:
        service:
          - payment-service
          - order-service
          - user-service
          - artist-service
          - catalog-service
          - cart-service
          - interaction-service
          - api-gateway
          - notification-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: npm audit (--audit-level=high)
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.service }}

  # ══════════════════════════════════════════════════════════════════════════════
  # 5. DOCKER BUILD — 10 images en parallèle → push GHCR (master uniquement)
  # ══════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: Docker · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 9 services applicatifs ──────────────────────────────────────────
          - service: api-gateway
            dockerfile: Dockerfile.gateway
            context: .
            build_args: SERVICE_DIR=api-gateway
          - service: user-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=user-service
          - service: artist-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=artist-service
          - service: catalog-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=catalog-service
          - service: interaction-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=interaction-service
          - service: order-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=order-service
          - service: cart-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=cart-service
          - service: payment-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=payment-service
          - service: notification-service
            dockerfile: Dockerfile
            context: .
            build_args: SERVICE_DIR=notification-service
          # ── 1 image PostgreSQL personnalisée (init.sql inclus) ──────────────
          - service: postgres
            dockerfile: docker/Dockerfile.postgres
            context: ./docker
            build_args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push · ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/craftea-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/craftea-${{ matrix.service }}:latest

  # ══════════════════════════════════════════════════════════════════════════════
  # 6. DEPLOY — SSH → docker stack deploy --with-registry-auth (master uniquement)
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy → Swarm
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/master'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "${{ secrets.SERVER_SSH_KNOWN_HOST }}" > ~/.ssh/known_hosts

      - name: Docker context (Swarm via SSH)
        run: |
          docker context create prod \
            --docker "host=ssh://${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          docker context use prod

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker stack deploy
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          FRONTEND_IMAGE_TAG: latest
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
          UMAMI_DATABASE_URL: ${{ secrets.UMAMI_DATABASE_URL }}
        run: |
          docker stack deploy \
            -c docker-stack.yml \
            craftea \
            --with-registry-auth \
            --prune

  # ══════════════════════════════════════════════════════════════════════════════
  # 7. HEALTHCHECK — curl https://craftea.ddnsfree.com/api/health (master uniquement)
  # ══════════════════════════════════════════════════════════════════════════════
  healthcheck:
    name: Healthcheck
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Attendre le démarrage des services (30s)
        run: sleep 30

      - name: curl /api/health
        run: |
          curl \
            --fail \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 15 \
            --silent \
            --show-error \
            https://craftea.ddnsfree.com/api/health
